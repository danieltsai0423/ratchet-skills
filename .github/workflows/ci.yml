name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skills
        run: python scripts/validate_skills.py

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install.sh (user scope, all agents)
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home-sh"
          mkdir -p "$HOME"
          sh install.sh
          test "$(ls "$HOME/.claude/skills" | wc -l)" -eq "$(ls skills | wc -l)"
          test "$(ls "$HOME/.agents/skills" | wc -l)" -eq "$(ls skills | wc -l)"
          # second run must skip and exit 1, --force must succeed
          if sh install.sh; then echo "expected skip"; exit 1; fi
          sh install.sh --force

      - name: install.sh (project scope, one skill)
        shell: bash
        run: |
          proj="$RUNNER_TEMP/proj-sh"
          mkdir -p "$proj"
          sh install.sh --agent claude --project "$proj" verify-software-behavior
          test -f "$proj/.claude/skills/verify-software-behavior/SKILL.md"
          test -f "$proj/.claude/skills/verify-software-behavior/references/invariants.md"
          test ! -e "$proj/.agents"

      - name: install.ps1 (PowerShell 7)
        shell: pwsh
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'proj-pwsh'
          New-Item -ItemType Directory $proj | Out-Null
          ./install.ps1 -Project $proj -Agent codex
          if ($LASTEXITCODE) { exit 1 }
          $n = (Get-ChildItem skills -Directory).Count
          if ((Get-ChildItem (Join-Path $proj '.agents/skills') -Directory).Count -ne $n) { throw 'count mismatch' }
          ./install.ps1 -Project $proj -Agent codex
          if ($LASTEXITCODE -ne 1) { throw 'expected skip exit 1' }
          ./install.ps1 -Project $proj -Agent codex -Force
          if ($LASTEXITCODE) { exit 1 }
          exit 0

      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'proj-ps51'
          New-Item -ItemType Directory $proj | Out-Null
          .\install.ps1 -Project $proj -Agent claude audit-agent-engineering
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path (Join-Path $proj '.claude\skills\audit-agent-engineering\SKILL.md'))) { throw 'missing' }
          exit 0
